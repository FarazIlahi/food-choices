<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#28634d">
  <meta name="description" content="Add food options and vote on what to eat each day.">
  <title>Food Choices</title>
  <link rel="icon" href="./icon.svg">
  <link rel="stylesheet" href="./style.css?v=4">
  <script src="./config.js?v=5"></script>
  <script type="module" src="./app.js?v=6"></script>
</head>
<body>
  <main>
    <header><a class="brand" href="./">✳ food choices.</a><span id="connection" class="status">Preview</span></header>
    <section class="intro"><h1>What are we eating?</h1><p>Add an option. Pick your favorite.</p></section>
    <div class="date-heading"><h2 id="date-label"></h2><div class="date-controls"><button id="prev-day" aria-label="Previous day">←</button><button id="today-date">Today</button><button id="next-day" aria-label="Next day">→</button></div></div>
    <nav class="day-strip" id="day-strip" aria-label="Choose a day"></nav>
    <p id="demo-note" class="notice">Preview: votes stay on this device. Shared voting isn’t connected yet.</p>
    <form id="option-form" class="option-form"><label class="sr-only" for="option-input">Food option</label><input id="option-input" name="option" maxlength="80" required placeholder="Pizza, biryani, burgers…" autocomplete="off"><button id="add-meal" class="button primary">＋ Add option</button></form>
    <p class="form-error" id="option-error" role="alert"></p>
    <div class="list-heading"><h2>Options</h2><span id="vote-summary" aria-live="polite">0 votes</span></div>
    <section id="meals" class="meal-list" aria-label="Food options and votes" aria-live="polite"></section>
    <p class="voting-hint">Options carry forward. One vote per day.</p>
    <footer><button id="family-button" class="text-button">Connect family</button></footer>
  </main>
  <dialog id="dialog"><button class="close" id="close-dialog" aria-label="Close dialog">×</button><div id="dialog-content"></div></dialog>
  <div id="toast" role="status"></div>
</body>
</html>
